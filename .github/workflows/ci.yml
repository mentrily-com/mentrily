name: CI

# Purely additive validation: lint, typecheck, unit/e2e/smoke tests, and
# build for both apps on every PR and push. This does NOT gate
# backend-deploy.yml, which currently ships to production on every push to
# main with no test check at all -- wiring that up is a separate,
# deliberate change to production deploy behavior that shouldn't ride
# along with adding the tests themselves.
#
# Lint runs with continue-on-error: both apps have pre-existing debt (as
# of the CI's introduction: ~19 errors/154 warnings on the frontend,
# several thousand @typescript-eslint/no-unsafe-* findings on the backend
# from pervasive `any`) that isn't this workflow's job to fix or hide.
# Making it a hard gate on day one would mark every PR red regardless of
# content; it stays informational -- visible in the job output -- until
# that debt is paid down separately, at which point flip it to a real
# gate. Typecheck, tests, dead-code (knip), and build are hard gates
# because they're already clean.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (informational -- see note below)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke / e2e tests
        run: npm run test:e2e
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          COOKIE_SECRET: ci-smoke-test-cookie-secret

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational -- see note below)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code check
        run: npm run knip

      - name: Build
        # Clerk's middleware wraps every route (public ones included) and
        # throws on boot without a publishable key, so the build needs it
        # even though this job never starts the server. Configure
        # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY / CLERK_SECRET_KEY as repo (or
        # environment) secrets -- a real Clerk dev-instance key pair, not
        # placeholder text, or the build fails with a clear "Missing
        # publishableKey" error rather than a silent skip.
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-placeholder-key' }}
          COOKIE_SECRET: ci-smoke-test-cookie-secret

  frontend-e2e:
    name: Frontend smoke tests (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        # e2e/smoke.spec.ts starts its own `next dev` server (see
        # playwright.config.ts's webServer block) -- no separate server
        # step needed here.
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-placeholder-key' }}
          COOKIE_SECRET: ci-smoke-test-cookie-secret

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
